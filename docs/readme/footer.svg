<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="Oz Studios. Oz Cleaner, made by Osayeed Zaber.">
<style>
  .m{font:500 11px ui-monospace,'JetBrains Mono',Consolas,monospace;letter-spacing:.14em;fill:#8a8a8a}
  .d{font:800 84px 'Bricolage Grotesque','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;letter-spacing:-.05em;fill:#f2f2f2}
  .l{font:200 84px 'Bricolage Grotesque','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;letter-spacing:-.05em;fill:#3a3a3a}
  .sh{animation:sh 5s ease-in-out infinite}
  .dot{animation:blink 1.2s steps(1) infinite}
  @keyframes sh{0%,100%{fill:#3a3a3a}50%{fill:#bdbdbd}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="960" height="240" rx="12" fill="#000"/>
<rect x=".5" y=".5" width="959" height="239" rx="12" fill="none" stroke="#1f1f1f"/>
<text x="40" y="44" class="m">MADE BY</text>
<text x="920" y="44" class="m" text-anchor="end">MIT · © 2026 OSAYEED ZABER</text>
<line x1="40" y1="60" x2="920" y2="60" stroke="#1f1f1f"/>
<text x="32" y="152" class="d">Oz</text><text x="160" y="152" class="l sh">Studios</text><rect class="dot" x="606" y="134" width="16" height="16" fill="#f2f2f2"/>
<text x="40" y="200" class="m" style="fill:#f2f2f2">OSAYEED ZABER · FOUNDER</text>
<text x="920" y="200" class="m" text-anchor="end">ZABER.TECH</text>
</svg>

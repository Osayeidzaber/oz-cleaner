<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="OZ — CLEANER. Explore. Clean. Debloat.">
<style>
  .m{font:500 11px ui-monospace,'JetBrains Mono',Consolas,monospace;letter-spacing:.14em;fill:#8a8a8a;text-transform:uppercase}
  .d{font:800 92px 'Bricolage Grotesque','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;letter-spacing:-.04em;fill:#f2f2f2}
  .l{font:200 92px 'Bricolage Grotesque','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;letter-spacing:-.04em;fill:#3a3a3a}
  .c{fill:#0d0d0d;stroke:#1f1f1f;stroke-width:1}
  .t{opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}
  .w{opacity:0;transform:translateY(14px);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
  .s{animation:scan 4.2s cubic-bezier(.6,0,.2,1) infinite}
  .b{animation:blink 1.1s steps(1) infinite}
  .hi{animation:hi 6s ease-in-out infinite}
  @keyframes in{to{opacity:1}}
  @keyframes up{to{opacity:1;transform:none}}
  @keyframes scan{0%{transform:translateX(-40px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(420px);opacity:0}}
  @keyframes blink{50%{opacity:0}}
  @keyframes hi{0%,100%{fill:#0d0d0d}45%,55%{fill:#f2f2f2}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect width="960" height="420" rx="12" fill="#000"/>
<rect x=".5" y=".5" width="959" height="419" rx="12" fill="none" stroke="#1f1f1f"/>
<text x="40" y="48" class="m" style="fill:#f2f2f2">OZ — CLEANER</text>
<text x="920" y="48" class="m" text-anchor="end">WINDOWS · NTFS · RUST</text>
<line x1="40" y1="66" x2="920" y2="66" stroke="#1f1f1f"/>
<g class="w" style="animation-delay:.1s"><text x="36" y="186" class="d">Explore.</text></g>
<g class="w" style="animation-delay:.35s"><text x="36" y="276" class="d">Clean.</text></g>
<g class="w" style="animation-delay:.6s"><text x="36" y="366" class="l">Debloat<tspan class="b" style="fill:#f2f2f2">_</tspan></text></g>
<!-- treemap, tiles fade in in sequence -->
<g transform="translate(500,96)">
  <rect class="c t" style="animation-delay:.2s" x="0" y="0" width="240" height="170" rx="4"/>
  <rect class="c t hi" style="animation-delay:.3s" x="244" y="0" width="176" height="96" rx="4"/>
  <rect class="c t" style="animation-delay:.4s" x="244" y="100" width="86" height="70" rx="4"/>
  <rect class="c t" style="animation-delay:.45s" x="334" y="100" width="86" height="70" rx="4"/>
  <rect class="c t" style="animation-delay:.5s" x="0" y="174" width="130" height="94" rx="4"/>
  <rect class="c t" style="animation-delay:.55s" x="134" y="174" width="106" height="44" rx="4"/>
  <rect class="c t" style="animation-delay:.6s" x="134" y="222" width="52" height="46" rx="4"/>
  <rect class="c t" style="animation-delay:.65s" x="190" y="222" width="50" height="46" rx="4"/>
  <rect class="c t" style="animation-delay:.7s" x="244" y="174" width="120" height="94" rx="4"/>
  <rect class="c t" style="animation-delay:.75s" x="368" y="174" width="52" height="56" rx="4"/>
  <rect class="c t" style="animation-delay:.8s" x="368" y="234" width="52" height="34" rx="4"/>
  <rect class="s" x="0" y="0" width="2" height="268" fill="#f2f2f2" opacity=".6"/>
  <text x="0" y="292" class="m">01 — MAP</text>
  <text x="420" y="292" class="m" text-anchor="end">[PLACEHOLDER]</text>
</g>
</svg>

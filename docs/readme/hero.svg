<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="Oz Cleaner, by Oz Studios. Explore. Clean. Debloat.">
<style>
  .m{font:500 11px ui-monospace,'JetBrains Mono',Consolas,monospace;letter-spacing:.14em;fill:#8a8a8a}
  .d{font:800 120px 'Bricolage Grotesque','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;letter-spacing:-.05em;fill:#f2f2f2}
  .l{font:200 120px 'Bricolage Grotesque','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;letter-spacing:-.05em;fill:#bdbdbd}
  .v{font:800 30px 'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;letter-spacing:-.02em;fill:#f2f2f2}
  .c{fill:#0d0d0d;stroke:#1f1f1f;stroke-width:1}
  .t{opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}
  .w{opacity:0;transform:translateY(18px);animation:up 1s cubic-bezier(.2,.8,.2,1) forwards}
  .s{animation:scan 4.2s cubic-bezier(.6,0,.2,1) infinite}
  .hi{animation:hi 6s ease-in-out infinite}
  .r{opacity:0;animation:rot 6s cubic-bezier(.2,.8,.2,1) infinite}
  .ul{transform-box:fill-box;transform:scaleX(0);animation:grow 1.2s 1s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes in{to{opacity:1}}
  @keyframes up{to{opacity:1;transform:none}}
  @keyframes grow{to{transform:scaleX(1)}}
  @keyframes scan{0%{transform:translateX(-40px);opacity:0}10%,90%{opacity:1}100%{transform:translateX(300px);opacity:0}}
  @keyframes hi{0%,100%{fill:#0d0d0d}45%,55%{fill:#f2f2f2}}
  @keyframes rot{0%{opacity:0;transform:translateY(12px)}5%,28%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-12px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}.r{opacity:0!important}.r0{opacity:1!important}}
</style>
<rect width="960" height="460" rx="12" fill="#000"/>
<rect x=".5" y=".5" width="959" height="459" rx="12" fill="none" stroke="#1f1f1f"/>
<text x="40" y="48" class="m" style="fill:#f2f2f2">OZ — CLEANER</text>
<text x="920" y="48" class="m" text-anchor="end">AN OZ STUDIOS PRODUCT</text>
<line x1="40" y1="66" x2="920" y2="66" stroke="#1f1f1f"/>
<g class="w" style="animation-delay:.1s"><text x="32" y="196" class="d">Oz</text></g>
<g class="w" style="animation-delay:.35s"><text x="32" y="306" class="l">Cleaner</text></g>
<g class="w" style="animation-delay:.7s"><text x="40" y="348" class="m" style="fill:#f2f2f2;font-size:13px">BY OZ STUDIOS</text></g>
<rect class="ul" x="40" y="358" width="118" height="2" fill="#f2f2f2"/>
<!-- rotating verb -->
<text x="40" y="410" class="m">01 — </text>
<text x="86" y="414" class="v r r0" style="animation-delay:1s">Explore your drive.</text>
<text x="86" y="414" class="v r" style="animation-delay:3s">Clean what rebuilds.</text>
<text x="86" y="414" class="v r" style="animation-delay:5s">Debloat, then undo.</text>
<g transform="translate(600,96)">
  <rect class="c t" style="animation-delay:.2s" x="0" y="0" width="170" height="150" rx="4"/>
  <rect class="c t hi" style="animation-delay:.3s" x="174" y="0" width="146" height="86" rx="4"/>
  <rect class="c t" style="animation-delay:.4s" x="174" y="90" width="70" height="60" rx="4"/>
  <rect class="c t" style="animation-delay:.45s" x="248" y="90" width="72" height="60" rx="4"/>
  <rect class="c t" style="animation-delay:.5s" x="0" y="154" width="100" height="100" rx="4"/>
  <rect class="c t" style="animation-delay:.55s" x="104" y="154" width="66" height="48" rx="4"/>
  <rect class="c t" style="animation-delay:.6s" x="104" y="206" width="31" height="48" rx="4"/>
  <rect class="c t" style="animation-delay:.65s" x="139" y="206" width="31" height="48" rx="4"/>
  <rect class="c t" style="animation-delay:.7s" x="174" y="154" width="96" height="100" rx="4"/>
  <rect class="c t" style="animation-delay:.75s" x="274" y="154" width="46" height="56" rx="4"/>
  <rect class="c t" style="animation-delay:.8s" x="274" y="214" width="46" height="40" rx="4"/>
  <rect class="s" x="0" y="0" width="2" height="254" fill="#f2f2f2" opacity=".6"/>
  <text x="0" y="278" class="m">MAP</text>
  <text x="320" y="278" class="m" text-anchor="end">[PLACEHOLDER]</text>
</g>
<text x="920" y="432" class="m" text-anchor="end">WINDOWS · NTFS · RUST · ZERO TELEMETRY</text>
</svg>

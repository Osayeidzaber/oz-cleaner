<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="Three jobs: Explore, Clean, Debloat">
<style>
  .m{font:500 11px ui-monospace,'JetBrains Mono',Consolas,monospace;letter-spacing:.14em;fill:#8a8a8a}
  .h{font:800 34px 'Bricolage Grotesque','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;letter-spacing:-.03em;fill:#f2f2f2}
  .p{font:400 14px 'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;fill:#bdbdbd}
  .col{opacity:0;transform:translateY(10px);animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
  .bar{transform-box:fill-box;transform:scaleX(0);animation:grow 3.6s cubic-bezier(.6,0,.2,1) infinite}
  @keyframes up{to{opacity:1;transform:none}}
  @keyframes grow{0%{transform:scaleX(0)}55%,85%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect width="960" height="220" rx="12" fill="#000"/>
<line x1="320" y1="28" x2="320" y2="192" stroke="#1f1f1f"/><line x1="640" y1="28" x2="640" y2="192" stroke="#1f1f1f"/>
<g class="col"><text x="32" y="44" class="m">01 — EXPLORE</text><text x="32" y="100" class="h">See it all.</text>
<text x="32" y="130" class="p">MFT scan, WebGL2 treemap.</text><text x="32" y="150" class="p">What fills the drive, fast.</text>
<rect class="bar" x="32" y="176" width="256" height="2" fill="#f2f2f2"/></g>
<g class="col" style="animation-delay:.2s"><text x="352" y="44" class="m">02 — CLEAN</text><text x="352" y="100" class="h">Say it plainly.</text>
<text x="352" y="130" class="p">Caches, temp, dev and AI tool junk,</text><text x="352" y="150" class="p">tiered Safe / Check first / Keep.</text>
<rect class="bar" x="352" y="176" width="256" height="2" fill="#f2f2f2" style="animation-delay:.4s"/></g>
<g class="col" style="animation-delay:.4s"><text x="672" y="44" class="m">03 — DEBLOAT</text><text x="672" y="100" class="h">Undo anything.</text>
<text x="672" y="130" class="p">Catalogued tweaks, every prior</text><text x="672" y="150" class="p">state in the Ledger.</text>
<rect class="bar" x="672" y="176" width="256" height="2" fill="#f2f2f2" style="animation-delay:.8s"/></g>
</svg>

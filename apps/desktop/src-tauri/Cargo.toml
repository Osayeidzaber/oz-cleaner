[package]
name = "oz-cleaner"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
oz-model = { path = "../../../crates/oz-model" }
oz-ntfs = { path = "../../../crates/oz-ntfs" }
oz-layout = { path = "../../../crates/oz-layout" }
oz-win = { path = "../../../crates/oz-win" }
oz-rules = { path = "../../../crates/oz-rules" }
oz-ops = { path = "../../../crates/oz-ops" }
oz-tweaks = { path = "../../../crates/oz-tweaks" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

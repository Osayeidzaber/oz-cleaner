# Tweak catalog (D-14, AGENTS.md section 6). Read the tweak gate before changing this file.
#
# `verified` stays empty until apply -> revert -> state-equal has passed in Windows Sandbox
# or a VM. While it is empty the app shows the tweak and its live state but refuses to apply it.
# `evidence` says where the mechanism comes from, using the labels from 03-ARCHITECTURE.md.
# Security and update settings are rejected by the loader and can never be added here.

# ---------------- Performance ----------------

[[tweak]]
id = "game-mode"
name = "Game Mode"
explain = "Windows gives the game you're playing priority and pauses some background work, such as driver installs from Windows Update."
category = "Performance"
tier = "Recommended"
kind = "reg_dword"
hive = "HKCU"
key = 'Software\Microsoft\GameBar'
value = "AutoGameModeEnabled"
on = "1"
restart = "none"
evidence = "KNOWN: value behind Settings > Gaming > Game Mode."
verified = ""

[[tweak]]
id = "power-high"
name = "High performance power plan"
explain = "Keeps the processor at higher speeds instead of saving power. Uses more energy; on a laptop, best only when plugged in."
category = "Performance"
tier = "Optional"
kind = "power_plan"
on = "8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c"
restart = "none"
evidence = "DOC: built-in High performance scheme GUID; PowerSetActiveScheme (powrprof)."
verified = ""

[[tweak]]
id = "core-parking-off"
name = "Keep all CPU cores awake"
explain = "Stops Windows parking idle cores, so they respond without a wake-up delay. Slightly higher idle power use."
category = "Performance"
tier = "Optional"
kind = "power_setting"
on = "100"
setting = "0cc5b647-c1df-4637-891a-dec35c318583"
subgroup = "54533251-82be-4824-96c1-47b60b740d00"
needs_admin = true
restart = "none"
evidence = "DOC: Processor performance core parking min cores (CPMINCORES) in the processor power subgroup."
verified = ""

[[tweak]]
id = "hags"
name = "Hardware-accelerated GPU scheduling"
explain = "Lets the graphics card manage its own memory scheduling. Can lower latency on supported GPUs and drivers."
category = "Performance"
tier = "Optional"
kind = "reg_dword"
hive = "HKLM"
key = 'SYSTEM\CurrentControlSet\Control\GraphicsDrivers'
value = "HwSchMode"
on = "2"
needs_admin = true
restart = "reboot"
evidence = "KNOWN: value behind Settings > Display > Graphics > Hardware-accelerated GPU scheduling."
verified = ""

[[tweak]]
id = "transparency-off"
name = "Turn off transparency effects"
explain = "Solid backgrounds in Start, the taskbar and windows. A small saving on older graphics."
category = "Performance"
tier = "Optional"
kind = "reg_dword"
hive = "HKCU"
key = 'Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
value = "EnableTransparency"
on = "0"
restart = "none"
evidence = "KNOWN: value behind Settings > Personalization > Colors > Transparency effects."
verified = ""

[[tweak]]
id = "menu-delay"
name = "Faster menus"
explain = "Submenus open after 100 ms instead of the default 400 ms."
category = "Performance"
tier = "Optional"
kind = "reg_sz"
hive = "HKCU"
key = 'Control Panel\Desktop'
value = "MenuShowDelay"
on = "100"
restart = "signout"
evidence = "DOC: SPI_SETMENUSHOWDELAY; per-user value MenuShowDelay."
verified = ""

[[tweak]]
id = "startup-delay-off"
name = "No delay for startup apps"
explain = "Windows normally waits a few seconds after sign-in before starting startup apps. This removes the wait."
category = "Performance"
tier = "Optional"
kind = "reg_dword"
hive = "HKCU"
key = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Serialize'
value = "StartupDelayInMSec"
on = "0"
restart = "signout"
evidence = "KNOWN: undocumented Explorer value; widely used. Treat as unverified until the Sandbox test."
verified = ""


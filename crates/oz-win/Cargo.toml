[package]
name = "oz-win"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
oz-model = { path = "../oz-model" }
oz-ntfs = { path = "../oz-ntfs" }

[dependencies.windows-sys]
version = "0.60"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]
